name: factory-ablation-contracts
on:
  push:
    branches: [main, "feat/paper-ablations-factory"]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal CPU test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2" "pytest>=8" "pytest-cov>=4" "pyyaml>=6" "matplotlib>=3.8"
      - name: Syntax check
        run: python -m compileall -q models optim research utils train.py evaluate.py decode.py
      - name: Repository documentation and shell entrypoint checks
        run: |
          python scripts/check_repo_docs.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Factory and ablation contract tests
        run: python -m pytest -q -o addopts='' tests/test_factory_ablations.py
