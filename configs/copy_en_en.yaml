# Compact copy/echo demo config — trains in ~10-20 min on a laptop CPU.
# (The base 6-layer/512-d_model config is documented in docs/TUTORIAL.md for
# scaling up on real CUDA hardware.)
model:
  N: 2
  d_model: 128
  d_ff: 512
  num_heads: 4
  dropout: 0.1
  attn_dropout: 0.0
  activation: "relu"
  share_embeddings: true
  tie_softmax_weight: true
  pos_encoding: "sinusoidal"
  label_smoothing: 0.0

data:
  dataset: "copy"
  lang_pair: "en-en"
  corpus_path: "sample_corpus.txt"
  max_src_len: 128
  max_tgt_len: 128
  min_len: 4
  tokenizer_dir: "work/tokenizer_en_en"
  vocab_size: 4000
  use_shared_vocab: true
  max_tokens_per_batch: 1500
  num_buckets: 8
  cache_dir: null

optim:
  lr: 5.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.0
  warmup_steps: 400
  max_steps: 3000
  grad_clip: 1.0

runtime:
  seed: 42
  device: "cpu"     # CPU is ~3-4x faster than this Mac's MPS for this model
  num_workers: 1
  log_dir: "work/logs_en_en"
  ckpt_dir: "work/checkpoints_en_en"
  tb_dir: "work/tb_en_en"
  save_every: 500
  eval_every: 500
  keep_last: 5
  amp: false
  accumulate_steps: 1

decode:
  beam_size: 4
  length_penalty: 0.6
  max_len_offset: 30
  max_len_ratio: 1.1
  repeat_penalty: 1.0    # 抑制重复，减少紧凑模型的循环退化