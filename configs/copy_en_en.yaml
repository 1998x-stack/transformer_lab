model:
  N: 6
  d_model: 512
  d_ff: 2048
  num_heads: 8
  dropout: 0.1
  attn_dropout: 0.0
  activation: "relu"
  share_embeddings: true
  tie_softmax_weight: true
  pos_encoding: "sinusoidal"
  label_smoothing: 0.0

data:
  dataset: "copy"
  lang_pair: "en-en"
  corpus_path: "sample_corpus.txt"
  max_src_len: 128
  max_tgt_len: 128
  min_len: 4
  tokenizer_dir: "work/tokenizer_en_en"
  vocab_size: 4000
  use_shared_vocab: true
  max_tokens_per_batch: 20000
  num_buckets: 8
  cache_dir: null

optim:
  lr: 5.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.0
  warmup_steps: 400
  max_steps: 6000
  grad_clip: 1.0

runtime:
  seed: 42
  device: "mps"
  num_workers: 1
  log_dir: "work/logs_en_en"
  ckpt_dir: "work/checkpoints_en_en"
  tb_dir: "work/tb_en_en"
  save_every: 1000
  eval_every: 1000
  keep_last: 5
  amp: false
  accumulate_steps: 1

decode:
  beam_size: 4
  length_penalty: 0.6
  max_len_offset: 30
  max_len_ratio: 1.1